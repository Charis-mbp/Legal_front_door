# n8n in Docker. Ollama runs natively on your machine (faster on a Mac: it uses the GPU),
# and n8n reaches it through host.docker.internal.
#   docker compose up -d   →   http://localhost:5678
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
volumes:
  n8n_data:
